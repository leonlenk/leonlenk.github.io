<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- A single shard: dark glass with a glowing teal-to-plum seam. -->
  <defs>
    <linearGradient id="seam" x1="4" y1="6" x2="28" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26ceee" />
      <stop offset="0.55" stop-color="#986edd" />
      <stop offset="1" stop-color="#dd6e9b" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" />
    </filter>
  </defs>
  <rect width="32" height="32" fill="#050510" />
  <polygon points="7,4 26,8 28,22 15,29 4,19" fill="none" stroke="url(#seam)" stroke-width="3.5" stroke-linejoin="round" opacity="0.75" filter="url(#glow)" />
  <polygon points="7,4 26,8 28,22 15,29 4,19" fill="#08081a" fill-opacity="0.9" stroke="url(#seam)" stroke-width="1.6" stroke-linejoin="round" />
  <polygon points="7,4 26,8 28,22 15,29 4,19" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.6" stroke-linejoin="round" />
</svg>
